<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{ myapp }} — Об авторе</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <ul class="nav nav-pills mb-4">
    {% for item in navigation %}
      <li class="nav-item"><a class="nav-link" href="{{ item.href }}">{{ item.caption }}</a></li>
    {% endfor %}
  </ul>
  <h1>Об авторе</h1>
  <p>Имя: {{ author_name }}</p>
  <p>Группа: {{ author_group }}</p>
</body>
</html>
