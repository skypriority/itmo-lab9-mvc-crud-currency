<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{ myapp }} — Пользователи</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <ul class="nav nav-pills mb-4">
    {% for item in navigation %}
      <li class="nav-item"><a class="nav-link" href="{{ item.href }}">{{ item.caption }}</a></li>
    {% endfor %}
  </ul>
  <h1>Пользователи</h1>
  <table class="table table-striped">
    <tr><th>ID</th><th>Имя</th><th>Действия</th></tr>
    {% for u in users %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.name }}</td>
        <td><a href="/user?id={{ u.id }}">Просмотр</a></td>
      </tr>
    {% endfor %}
  </table>
</body>
</html>
